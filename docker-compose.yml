services:
  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    image: oven/bun:1
    restart: unless-stopped
    working_dir: /app
    command: sh -c "bun install && bun --hot src/index.tsx"
    env_file: .env
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - app_node_modules:/app/node_modules
    depends_on:
      - db

volumes:
  pgdata:
  app_node_modules:
  